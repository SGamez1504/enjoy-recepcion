<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141518">
<title>Recepción Enjoy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: one-column thumb-first tool — sticky top bar, big tile grid, counters in the lower half. Palette: graphite + box-tape amber. */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --surface-2:#e9e7e2; --fg:#1c1d20; --muted:#62646b; --line:#d6d3cc;
  --accent:#e8a317; --accent-fg:#1c1d20; --accent-soft:#fbefd2;
  --ok:#1f8a4c; --warn:#b4541a; --nv:#3f9b2d; --amd:#c8352b; --intel:#2c6fd1;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141518; --surface:#1d1f23; --surface-2:#272a30; --fg:#eceae6; --muted:#9a9ca3; --line:#33363d;
  --accent:#f2b230; --accent-fg:#141518; --accent-soft:#3a2f17; --ok:#4cc27e; --warn:#e58a4f;
  --nv:#6cc957; --amd:#ef6a5f; --intel:#6aa2f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --surface:#1d1f23; --surface-2:#272a30; --fg:#eceae6; --muted:#9a9ca3; --line:#33363d;
  --accent:#f2b230; --accent-fg:#141518; --accent-soft:#3a2f17; --ok:#4cc27e; --warn:#e58a4f;
  --nv:#6cc957; --amd:#ef6a5f; --intel:#6aa2f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;max-width:720px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--fg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.3 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
h2{font:700 26px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 10px;text-wrap:balance}
h3{font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:56px;padding:0 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);min-height:64px}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;font-weight:600}
.pill{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:104px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--line))}
.tile .t-name{font:700 21px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;padding-left:4px}
.tile .t-count{font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums;padding-left:4px}
.tile .t-count small{font:500 12px var(--body);color:var(--muted);margin-left:4px}
.subs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.subs .chip{flex:none}
.search{position:relative}
.search input{width:100%;min-height:56px;padding:0 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--accent);outline:none}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.res button{display:flex;gap:10px;align-items:center;text-align:left;padding:12px 14px;min-height:56px;border:0;border-top:1px solid var(--line);background:transparent;width:100%}
.res button:first-child{border-top:0}
.res .grow{flex:1;min-width:0}
.res .sku{display:block;font:500 12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .plus{font:700 22px var(--mono);color:var(--accent)}
.freq{display:flex;flex-wrap:wrap;gap:8px}
.freq .chip{font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.crumbs .sep{color:var(--muted)}
.facets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fchip{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:56px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-align:left;min-width:0}
.fchip small{font:500 12px var(--mono);color:var(--muted)}
.fchip.ghost{background:transparent;color:var(--muted);font-weight:500}
.rec-row{display:flex;gap:8px;align-items:stretch}
.rec-row .list-item{flex:1;min-width:0}
.rec-row .del{min-width:56px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.card.mine{border-color:var(--accent)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-head .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.card-head b{font-weight:600}
.total{font:700 32px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.total small{display:block;font:500 11px var(--body);color:var(--muted);text-align:right;margin-top:4px}
.who{font-size:12px;color:var(--muted)}
.counter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.counter button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:700 22px var(--mono)}
.counter button.add{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.icon-btn{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:688px;margin:0 auto;display:flex;gap:8px}
.bar-in .btn{flex:1}
.note{padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.sum-sec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.sum-sec header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);font:700 18px var(--display);text-transform:uppercase;letter-spacing:.02em}
.sum-row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:baseline}
.sum-row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.sum-row .q{font:700 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
pre.wa{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:320px;overflow:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.names input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
@media (prefers-reduced-motion:no-preference){.counter button:active,.tile:active,.btn:active{transform:scale(.97)}}
</style>

</head>
<body>
<div class="top">
  <div class="brand" id="brand">Recepción Enjoy<small id="sub">Inventario de mercancía</small></div>
  <button class="chip" id="whoBtn" data-act="who"><span class="dot" id="sync"></span><span id="whoName">¿Quién eres?</span></button>
</div>
<main id="app"><h2>Cargando…</h2><p class="muted">Conectando con la base de datos compartida.</p></main>
<div class="bar" id="bar" hidden><div class="bar-in" id="barIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
